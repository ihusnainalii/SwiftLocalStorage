name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    name: Build (-warnings-as-errors) + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-build-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test + coverage (90% line floor)
        run: bash scripts/coverage.sh
      - name: Coverage to job summary
        if: always()
        run: cat .build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - run: swift test --sanitize=thread

  demo:
    name: Demo app (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild test
        run: |
          xcodebuild -project Examples/SwiftLocalStorageDemo/SwiftLocalStorageDemo.xcodeproj \
            -scheme SwiftLocalStorageDemo \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' test
