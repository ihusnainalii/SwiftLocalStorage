name: Release

# Releases are cut by hand: a `chore(release): x.y.z` commit, a `vX.Y.Z` tag and a GitHub
# Release whose notes are the new CHANGELOG section. Publishing that Release runs this
# workflow, which re-checks the tagged commit and attaches coverage and a static DocC site.
# It never commits or opens pull requests.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and attach assets to (e.g. v1.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-attach:
    name: Verify tag and attach assets
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test --parallel
      - name: Attach coverage to the Release
        run: |
          bash scripts/coverage.sh
          gh release upload "$TAG" .build/coverage/coverage.lcov .build/coverage/summary.md --clobber
      - name: Build DocC and attach to the Release
        run: |
          xcodebuild docbuild \
            -scheme SwiftLocalStorage \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/docbuild"
          archive=$(find "$RUNNER_TEMP/docbuild" -type d -name '*.doccarchive' | head -1)
          "$(xcrun --find docc)" process-archive transform-for-static-hosting "$archive" \
            --output-path "$RUNNER_TEMP/docc-static" \
            --hosting-base-path docs
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/docc-static" --no-mac-metadata -czf docc-static.tar.gz .
          gh release upload "$TAG" docc-static.tar.gz --clobber
